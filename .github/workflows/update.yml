name: 데이터 갱신과 배포
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'   # 매일 오전 6시 17분(한국 시간)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 금리·영상·소식 가져오기
        run: node scripts/update.mjs
        env:
          FSS_KEY: ${{ secrets.FSS_KEY }}
          YT_KEY: ${{ secrets.YT_KEY }}
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "modori-bot"
          git config user.email "modori-bot@users.noreply.github.com"
          git add site/data/live.json
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +%F)"
          git push || echo "푸시 건너뜀"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
